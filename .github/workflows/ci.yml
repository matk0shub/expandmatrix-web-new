name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # CI needs Payload env vars to initialize, even if the DB is a stub.
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET || 'ci-test-secret-not-for-prod' }}
          DATABASE_URI: ${{ secrets.DATABASE_URI || 'mongodb://localhost:27017/ci' }}
          NEXT_PUBLIC_PAYLOAD_SERVER_URL: http://localhost:3000
          PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3000
          # Disable outbound network for payload prewarm in CI
          CI: true
